<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="player">

    <div class="cover">
        🎵
    </div>

    <h1 id="title">My Song</h1>
    <p id="artist">My Artist</p>

    <audio id="audio"></audio>

    <input
        type="range"
        id="progress"
        value="0"
        min="0"
        max="100"
    >

    <div class="time">
        <span id="current">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <div class="controls">

        <button onclick="previousSong()">⏮</button>

        <button class="play" onclick="playPause()" id="playBtn">
            ▶
        </button>

        <button onclick="nextSong()">⏭</button>

    </div>

    <div class="volume">
        🔊
        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >
    </div>

    <h2>Playlist</h2>

    <div id="playlist"></div>

</div>

<script src="script.js"></script>

</body>
</html>
